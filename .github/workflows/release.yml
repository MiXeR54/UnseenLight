# Manual release pipeline: builds the plugin and publishes it to Modrinth, Hangar and GitHub Releases.
# Triggered only by hand: Actions -> Release -> Run workflow.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.1.0"
        required: true
      changelog:
        description: "Changelog for this version"
        required: false
        default: "See the commit history."
      type:
        description: "Release channel"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write   # lets mc-publish create the GitHub release and tag

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build -Pversion=${{ inputs.version }}

      - name: Publish to Modrinth and GitHub Releases
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: OvVEUQSP
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/UnseenLight-${{ inputs.version }}.jar
          name: UnseenLight ${{ inputs.version }}
          version: ${{ inputs.version }}
          version-type: ${{ inputs.type }}
          loaders: paper
          game-versions: "26.2"
          changelog: ${{ inputs.changelog }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ inputs.version }}

      # Hangar has no ready-made action worth depending on, so this talks to its REST API directly.
      # Skipped when the HANGAR_API_TOKEN secret is not configured.
      # Non-release builds go to the "Snapshot" channel, which must exist in the Hangar project.
      - name: Publish to Hangar
        if: env.HANGAR_API_TOKEN != ''
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.type == 'release' && 'Release' || 'Snapshot' }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          jwt=$(curl -sSf -X POST "https://hangar.papermc.io/api/v1/authenticate?apiKey=${HANGAR_API_TOKEN}" | jq -r .token)
          payload=$(jq -n --arg v "$VERSION" --arg c "$CHANNEL" --arg d "$CHANGELOG" \
            '{version: $v, channel: $c, description: $d,
              platformDependencies: {PAPER: ["26.2"]},
              files: [{platforms: ["PAPER"]}]}')
          curl -sSf -X POST "https://hangar.papermc.io/api/v1/projects/UnseenLight/upload" \
            -H "Authorization: HangarAuth ${jwt}" \
            -F "versionUpload=${payload};type=application/json" \
            -F "files=@build/libs/UnseenLight-${VERSION}.jar"
