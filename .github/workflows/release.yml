# Manual release pipeline: builds the plugin and publishes it to Modrinth and GitHub Releases.
# Triggered only by hand: Actions -> Release -> Run workflow.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.1.0"
        required: true
      changelog:
        description: "Changelog for this version"
        required: false
        default: "See the commit history."
      type:
        description: "Release channel"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write   # lets mc-publish create the GitHub release and tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build -Pversion=${{ inputs.version }}

      - name: Publish to Modrinth and GitHub Releases
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: OvVEUQSP
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/UnseenLight-${{ inputs.version }}.jar
          name: UnseenLight ${{ inputs.version }}
          version: ${{ inputs.version }}
          version-type: ${{ inputs.type }}
          loaders: paper
          game-versions: "26.2"
          changelog: ${{ inputs.changelog }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ inputs.version }}
